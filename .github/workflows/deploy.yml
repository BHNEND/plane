name: 部署 Plane

on:
  workflow_dispatch:
  push:
    branches:
      - preview

concurrency:
  group: plane-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script_stop: true
          script: |
            set -eu

            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            RELEASE='v1.4.2'
            COMPOSE_URL="https://raw.githubusercontent.com/makeplane/plane/${RELEASE}/deployments/cli/community/docker-compose.yml"

            test -n "$DEPLOY_PATH"
            test -d "$DEPLOY_PATH"
            command -v docker >/dev/null
            docker compose version >/dev/null
            test -f "$DEPLOY_PATH/.env"

            cd "$DEPLOY_PATH"
            chmod 600 .env
            chown root:root .env

            grep -q '^APP_DOMAIN=plane\.lklk\.ai$' .env
            grep -q '^APP_RELEASE=v1\.4\.2$' .env
            grep -q '^LISTEN_HTTP_PORT=13200$' .env
            grep -q '^LISTEN_HTTPS_PORT=13201$' .env
            grep -q '^WEB_URL=https://plane\.lklk\.ai$' .env
            grep -q '^CORS_ALLOWED_ORIGINS=https://plane\.lklk\.ai$' .env

            curl --fail --silent --show-error --location "$COMPOSE_URL" --output docker-compose.yml.new
            mv docker-compose.yml.new docker-compose.yml
            sed -i 's#CERT_ACME_CA: ${CERT_ACME_CA}#CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}#' docker-compose.yml
            sed -i '/published: ${LISTEN_HTTP_PORT:-80}/a\        host_ip: 127.0.0.1' docker-compose.yml
            sed -i '/published: ${LISTEN_HTTPS_PORT:-443}/a\        host_ip: 127.0.0.1' docker-compose.yml

            docker compose -f docker-compose.yml --env-file .env config >/tmp/plane-compose-config.yml
            docker compose -f docker-compose.yml --env-file .env pull --quiet
            docker compose -f docker-compose.yml --env-file .env up -d

            migrator_id="$(docker compose -f docker-compose.yml --env-file .env ps -q migrator)"
            test -n "$migrator_id"
            i=0
            while [ "$i" -lt 300 ]; do
              state="$(docker inspect --format '{{.State.Status}}' "$migrator_id")"
              [ "$state" = "exited" ] && break
              [ "$state" = "dead" ] && break
              sleep 1
              i=$((i + 1))
            done
            test "$(docker inspect --format '{{.State.Status}}' "$migrator_id")" = exited
            test "$(docker inspect --format '{{.State.ExitCode}}' "$migrator_id")" = 0

            api_id="$(docker compose -f docker-compose.yml --env-file .env ps -q api)"
            test -n "$api_id"
            i=0
            until docker exec "$api_id" python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)" >/dev/null 2>&1; do
              [ "$i" -ge 300 ] && { docker compose -f docker-compose.yml --env-file .env ps; docker compose -f docker-compose.yml --env-file .env logs --tail=120 api migrator proxy; exit 1; }
              sleep 1
              i=$((i + 1))
            done

            test "$(docker inspect --format '{{.State.Status}}' "$api_id")" = running
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:13200/ >/dev/null
            docker compose -f docker-compose.yml --env-file .env ps
